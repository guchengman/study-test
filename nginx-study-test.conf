# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name www.xiaoyue.shop xiaoyue.shop <REDACTED_IP>;
    return 301 https://www.xiaoyue.shop$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name www.xiaoyue.shop xiaoyue.shop;

    ssl_certificate /etc/nginx/ssl/www.xiaoyue.shop.crt;
    ssl_certificate_key /etc/nginx/ssl/www.xiaoyue.shop.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /home/zengxiao/study-test/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # index.html 不缓存（确保用户总拿到最新版）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（Vite 构建的文件名带 hash）
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # P2-9：tesseract OCR 无 hash 静态资产（语言包 ~34MB + wasm core），补 MIME 与 30 天缓存
    # 文件名不含 hash、随 npm 包版本整体替换，故不用 immutable，30d 平衡更新时效
    # ^~ 阻断下方 \.wasm/\.mjs 正则（避免无 hash 的 tesseract 文件被 immutable 长期锁死）
    location ^~ /tesseract/ {
        expires 30d;
        add_header Cache-Control "public";
        location ~* \.wasm$ {
            default_type application/wasm;
            expires 30d;
            add_header Cache-Control "public";
        }
        location ~* \.wasm\.js$ {
            default_type text/javascript;
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    # P2-9：其余无 hash 公共文件（favicon/示例文件）短缓存，降低重复访问开销又不至于陈旧
    # 排除 /assets/（带 hash 文件由上方 365d immutable 接管，nginx 正则优先级高于前缀匹配）
    location ~* "^/(?!assets/).+\.(?:svg|png|jpg|jpeg|gif|ico|csv|xlsx)$" {
        expires 7d;
        add_header Cache-Control "public";
    }

    # PDF worker / wasm MIME 修正（修复 Failed to load module script / Setting up fake worker failed）
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
