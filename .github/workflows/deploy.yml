name: Deploy to Alibaba Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_build:
        description: '跳过构建（仅重启服务）'
        required: false
        default: 'false'
        type: boolean

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: root
  SERVER_PATH: ${{ secrets.SERVER_PATH }}

jobs:
  # Phase 2 / M1 跨租户隔离守门：起真实 MySQL 5.7 service 容器 + boot 真后端，
  # 跑 integration_exam + isolation 两套集成测试；任一不过即 exit≠0，经 deploy 的 needs 阻断部署。
  # 注意：server 绑 0.0.0.0（仅 IPv4），而 Node20 fetch localhost 会优先 ::1 → ECONNREFUSED，故统一用 127.0.0.1。
  isolation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: study_test
          MYSQL_USER: studyapp
          MYSQL_PASSWORD: citestpw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: studyapp
      DB_PASSWORD: citestpw
      DB_NAME: study_test
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-0123456789
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: '3100'
      EXAM_IT_BASE: http://127.0.0.1:3100/api
      EXAM_IT_DB_HOST: 127.0.0.1
      EXAM_IT_DB_PORT: '3306'
      EXAM_IT_DB_USER: studyapp
      EXAM_IT_DB_PASSWORD: citestpw
      EXAM_IT_DB_NAME: study_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Install server deps
        run: cd server && npm ci
        # 说明：不跑根 npm ci / build-scoring。本 job 不需前端构建；examScoring.generated.js 已入库；
        #   集成/隔离脚本与后端仅依赖 server/node_modules（mysql2/dotenv/express 等），根 esbuild 为隐式传递依赖、不可靠。
      - name: Run migrations
        run: node server/src/migrate.js
      - name: Boot server (background)
        run: |
          (cd server && exec node src/index.js) > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          echo "server not healthy"; cat server.log; exit 1
      - name: Run integration + isolation suites
        # 注：apiLimiter 为单实例跨 questions/subjects/practice/sync/upload/tags/notifications/admin 等 11 路由共享，
        #   即 300 次/15分钟/每 IP 为这些前缀的【合计】单桶（非各自 300）。当前两套件受限调用约 ~100 次，余量 2–3 倍。
        #   若后续新增大量断言触发 429 随机红，则需为限流提供 env 上限开关（API_LIMIT_MAX）或拆分重启后端，不属 M1 范围。
        run: |
          node server/tests/integration_exam.mjs
          node server/tests/isolation.integration.mjs
      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: isolation-server-log, path: server.log }

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: isolation-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        if: github.event.inputs.skip_build != 'true'
        run: |
          npm ci
          # P2-9：OCR 本地资产（public/tesseract 被 gitignore，需在 CI 内生成，否则 rsync --delete 会清掉线上语言包导致 OCR 不可用）
          npm run setup:tesseract
          cd server && npm ci && npx vitest run && cd ..
          npx vitest run
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/private_key
          chmod 600 ~/.ssh/private_key

      - name: Deploy to server
        run: |
          rsync -avz --delete ./dist/ -e "ssh -i ~/.ssh/private_key" root@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/dist/
          rsync -avz --delete ./server/src/ -e "ssh -i ~/.ssh/private_key" root@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/server/src/
          rsync -avz ./package.json -e "ssh -i ~/.ssh/private_key" root@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/
          rsync -avz ./server/package.json -e "ssh -i ~/.ssh/private_key" root@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/server/
          rsync -avz ./server/package-lock.json -e "ssh -i ~/.ssh/private_key" root@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/server/
          rsync -avz ./server/migrations/ -e "ssh -i ~/.ssh/private_key" root@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }}/server/migrations/
          # P2-9：同步 nginx 配置到临时路径（服务器现役位置未知，由下方步骤定位后原子替换）
          rsync -avz ./nginx-study-test.conf -e "ssh -i ~/.ssh/private_key" root@${{ env.SERVER_HOST }}:/tmp/study-nginx-new.conf

      - name: Update environment files
        run: |
          printf '%s\n' \
            "PORT=3100" \
            "NODE_ENV=production" \
            "TRUST_PROXY=1" \
            "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            "JWT_EXPIRES_IN=7d" \
            "DB_HOST=${{ secrets.DB_HOST }}" \
            "DB_PORT=${{ secrets.DB_PORT }}" \
            "DB_USER=${{ secrets.DB_USER }}" \
            "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            "DB_NAME=${{ secrets.DB_NAME }}" \
            "BAIDU_API_KEY=${{ secrets.BAIDU_API_KEY }}" \
            "BAIDU_SECRET_KEY=${{ secrets.BAIDU_SECRET_KEY }}" \
            "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" \
            "EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}" \
            "EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}" \
            "EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}" \
            | ssh -i ~/.ssh/private_key root@${{ env.SERVER_HOST }} "mkdir -p ${{ env.SERVER_PATH }}/server && cat > ${{ env.SERVER_PATH }}/server/.env && chmod 600 ${{ env.SERVER_PATH }}/server/.env"

      - name: Install dependencies and restart
        run: |
          ssh -i ~/.ssh/private_key root@${{ env.SERVER_HOST }} << 'SSHEOF'
            set -e
            cd ${{ env.SERVER_PATH }}/server
            npm ci --production
            node src/migrate.js || echo "⚠️ 数据库迁移步骤未成功完成（不影响代码部署），请检查日志"
            pm2 restart study-server || pm2 start src/index.js --name study-server
            # 日志轮转（P1-7）：首次部署自动安装 pm2-logrotate，单文件 10MB、保留 7 份、gzip 压缩
            pm2 describe pm2-logrotate >/dev/null 2>&1 || pm2 install pm2-logrotate
            pm2 set pm2-logrotate:max_size 10M
            pm2 set pm2-logrotate:retain 7
            pm2 set pm2-logrotate:compress true
            pm2 save
            # P2-9：用仓库配置更新现役 nginx conf（差异则备份→替换→nginx -t 校验，失败自动回滚，保证站点不因配置错误断流）
            CONF=$(grep -rl 'study-test/dist' /etc/nginx/ 2>/dev/null | head -1)
            if [ -n "$CONF" ] && ! cmp -s /tmp/study-nginx-new.conf "$CONF"; then
              cp "$CONF" "$CONF.bak.$(date +%s)"
              cp /tmp/study-nginx-new.conf "$CONF"
              if nginx -t 2>/dev/null; then
                nginx -s reload && echo "✅ nginx 配置已更新并 reload"
              else
                cp "$CONF".bak.* "$CONF" && nginx -t && echo "⚠️ nginx 新配置校验失败，已回滚"
              fi
            else
              nginx -t && nginx -s reload
            fi
          SSHEOF

      - name: Health check
        run: |
          sleep 10
          STATUS=$(ssh -i ~/.ssh/private_key root@${{ env.SERVER_HOST }} "curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/health")
          if [ "$STATUS" = "200" ]; then
            echo "✅ 健康检查成功（直连 localhost:3100，已绕过 Cloudflare）"
          else
            echo "❌ 健康检查失败，状态码：$STATUS"
            exit 1
          fi

      - name: Deploy completed
        run: |
          echo "✅ 部署成功！"
          echo "🌐 访问地址：https://www.xiaoyue.shop"